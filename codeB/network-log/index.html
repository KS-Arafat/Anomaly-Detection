<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width,initial-scale=1" />
		<title>Network Log Dashboard</title>
		<link rel="stylesheet" href="styles.css" />
	</head>
	<body>
		<div class="wrap">
			<header>
				<div>
					<h1>Network Log Dashboard</h1>
					<div class="small">
						Realtime view of network events with severity indicators
					</div>
				</div>
				<div class="controls">
					<div class="flex">
						<label class="small" for="filter">Filter:</label>
						<select id="filter">
							<option value="all">All severities</option>
							<option value="normal">Normal</option>
							<option value="warning">Warning</option>
							<option value="danger">Danger</option>
						</select>
					</div>
					<div class="tools">
						<button id="pause">Pause</button>
						<button id="clear" class="secondary">Clear</button>
					</div>
				</div>
			</header>

			<section class="panel">
				<div class="stats">
					<div class="stat">
						<div>
							<div class="small">Normal</div>
							<div id="count-normal" style="font-weight: 700">0</div>
						</div>
						<div><span class="badge normal">OK</span></div>
					</div>
					<div class="stat">
						<div>
							<div class="small">Warning</div>
							<div id="count-warning" style="font-weight: 700">0</div>
						</div>
						<div><span class="badge warning">WARN</span></div>
					</div>
					<div class="stat">
						<div>
							<div class="small">Danger</div>
							<div id="count-danger" style="font-weight: 700">0</div>
						</div>
						<div><span class="badge danger">DANGER</span></div>
					</div>
				</div>

				<table class="log-list" aria-live="polite">
					<thead>
						<tr>
							<th style="width: 160px">Time</th>
							<th>Message</th>
							<th style="width: 160px">Source</th>
							<th style="width: 110px">Severity</th>
						</tr>
					</thead>
					<tbody id="logs"></tbody>
				</table>

				<footer>
					Use the controls to pause updates or filter by severity.
				</footer>
			</section>
		</div>

		<script src="main.js"></script>
	</body>
</html>
