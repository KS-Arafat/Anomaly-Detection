<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Weather App</title>
		<link
			rel="stylesheet"
			href="{{ url_for('static', filename='css/main.css') }}"
		/>
	</head>
	<body>
		<div class="app-wrap">
			<header>
				<input
					type="text"
					autocomplete="off"
					class="search-box"
					placeholder="Search for a city..."
				/>
			</header>
			<main>
				<section class="location" id="location">
					<div class="city" id="city">New York, US</div>
					<div class="date" id="date">Wednesday 22 July 2020</div>
				</section>
				<div class="current">
					<div class="temp" id="temp">15<span>°c</span></div>
					<div class="weather" id="weather">Sunny</div>
					<div class="hi-low" id="hi-low">13°c / 16°c</div>
				</div>
			</main>
		</div>
		<script src="{{ url_for('static', filename='js/main.js') }}"></script>
	</body>
</html>
